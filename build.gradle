plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.165'
}

version = "1.0.0-1.21.1"
group = "com.pacificrim.mod"

base {
    archivesName = "pacific-rim-mod"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers {
    file('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
    configureEach {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'pacificrim'
        ideName = "NeoForge ${it.name.capitalize()} (${path})"
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.clientDebugEnabled', 'true'
    }

    server {
        programArgument '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/main/resources' }

repositories {
    mavenLocal()
}

dependencies {
    // Обновлено до версии для Minecraft 1.21.1 (NeoForge 21.1.x)
    implementation "net.neoforged:neoforge:21.1.90"
}
